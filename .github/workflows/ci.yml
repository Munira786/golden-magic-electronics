# Runs on every pull request and on every push to main.
# A PR shows a red ✗ if lint, tests or the production build fail, so broken code is caught before merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks code, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc, same as Netlify)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
